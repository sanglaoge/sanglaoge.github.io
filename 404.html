<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走错屋子了 · 桑老哥的展厅</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--bg:#FAF3EA;--text:#2C1810;--muted:#7A6A5C;--accent:#C4573B}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;line-height:1.8}
.code{font-family:Georgia,serif;font-size:clamp(64px,16vw,120px);letter-spacing:6px;color:var(--accent);line-height:1}
h1{font-size:22px;font-weight:600;letter-spacing:2px;margin:14px 0 10px}
p{color:var(--muted);font-size:15px;max-width:30em}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.links a{text-decoration:none;color:var(--text);border:1px solid #E5D5C0;background:#fff;border-radius:999px;padding:8px 20px;font-size:14px;letter-spacing:1px;transition:.2s}
.links a:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>这间屋子还没建好</h1>
  <p>你要找的页面不存在，或者已经搬走了。从下面这些门重新进去吧。</p>
  <div class="links">
    <a href="/">回首页</a>
    <a href="/concepts/">概念馆</a>
    <a href="/videos/">放映厅</a>
    <a href="/html/">文稿室</a>
  </div>
</body>
</html>
